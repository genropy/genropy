name: JavaScript tests

on:
  # Branch pushes only: release tags run these tests from release-publish.yml
  push:
    branches: ["**"]
  pull_request:
  # Called by the release and nightly docker workflows as a gate
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test gnrjs/tests/*.test.js
