name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    tags:
      - "release-*"

jobs:
  python-tests:
    uses: ./.github/workflows/tests.yml

  javascript-tests:
    uses: ./.github/workflows/javascript-tests.yml

  version:
    name: Read the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
    - uses: actions/checkout@v5
    - id: read
      run: |
        VERSION=$(sed -n 's/^VERSION = \"\([0-9.]*\)\"/\1/p' gnrpy/gnr/__init__.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from gnrpy/gnr/__init__.py" >&2
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and push the versioned docker image
    needs: [python-tests, javascript-tests, version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: ${{ needs.version.outputs.version }}

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: |
        python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: |
        cd gnrpy
        python3 -m build --wheel
    - name: Store the distribution packages
      uses: actions/upload-artifact@v6
      with:
        name: python-package-distributions
        path: gnrpy/dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    - docker
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/genropy
    permissions:
      id-token: write 

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: gnrpy/dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: gnrpy/dist/

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write 
      id-token: write 

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: gnrpy/dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./gnrpy/dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --notes ""
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.ref_name }}' gnrpy/dist/**
        --repo '${{ github.repository }}'

  docker-latest:
    name: Point the latest docker image to this release
    needs:
    - version
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Tag the release image as latest
      run: >-
        docker buildx imagetools create
        --tag ghcr.io/${{ github.repository }}:latest
        ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
