name: Nightly develop docker image

# Builds ghcr.io/<repo>:develop from the develop branch, only when the test
# suites pass. Release images are built by release-publish.yml.

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC, runs on the default branch (develop)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop can be built as the develop image
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "This workflow builds the develop image: run it on develop, not ${{ github.ref }}" >&2
            exit 1
          fi

  python-tests:
    needs: check-branch
    uses: ./.github/workflows/tests.yml

  javascript-tests:
    needs: check-branch
    uses: ./.github/workflows/javascript-tests.yml

  docker:
    needs: [python-tests, javascript-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tag: develop
