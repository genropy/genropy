name: Code testing (python)

on:
  # Branch pushes only: release tags run these tests from release-publish.yml
  push:
    branches: ["**"]
  # Called by the release and nightly docker workflows as a gate
  workflow_call:

jobs:
  base-install:
    # The build job installs .[developer], which pulls the optional extras
    # (genro-storage among them), so it cannot see a startup import that
    # needs one. This job installs genropy alone and checks that every
    # module a site imports at startup still loads.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install genropy without extras
      run: |
        python -m pip install --upgrade pip
        cd gnrpy && pip install -e . pytest
        # the check below means nothing if a base dependency pulls the extra
        if python -c "import genro_storage" 2>/dev/null; then
          echo "genro_storage is installed: this job no longer tests the base install"
          exit 1
        fi
    - name: Startup imports
      run: |
        cd gnrpy && pytest tests/web/gnrservices_import_test.py -q

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: dockette/postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
            
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Add cache step
    - name: Cache Python dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ matrix.python-version }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-
          ${{ runner.os }}-python-
    
    # pytest-testmon records which tests execute which code in
    # gnrpy/.testmondata. A branch push restores the newest database of its
    # own branch, or the develop one on its first push, and runs only the
    # tests affected by the changes since then. develop, master and the
    # workflow_call runs (release and nightly gates) always run the whole
    # suite and refresh the database, so they also catch what testmon cannot
    # see, such as a change to a non-Python file read by a test.
    - name: Restore the testmon database
      uses: actions/cache/restore@v5
      with:
        path: gnrpy/.testmondata
        key: testmon-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          testmon-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.ref_name }}-
          testmon-${{ runner.os }}-python-${{ matrix.python-version }}-develop-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8==7.1.2 pytest==9.2.0 pytest-testmon==2.3.1
        cd gnrpy && pip install -e .[developer]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=F401,E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        #flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        FULL_RUN: ${{ github.event_name != 'push' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' }}
      run: |
        cd gnrpy
        if [ "$FULL_RUN" = "true" ]; then
          pytest --testmon-noselect
        else
          # exit code 5: no test is affected by the changes, nothing to run
          pytest --testmon || [ $? -eq 5 ]
        fi
    - name: Save the testmon database
      if: ${{ !cancelled() && hashFiles('gnrpy/.testmondata') != '' }}
      uses: actions/cache/save@v5
      with:
        path: gnrpy/.testmondata
        key: testmon-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.ref_name }}-${{ github.sha }}
    - name: Documentation ratchet on the test-page packages
      run: |
        # gnrpy's pytest config restricts collection to gnrpy/tests, so the
        # package suites under projects/ need their own invocation. Only the
        # source-only checks belong here: the render sweep needs a built
        # instance and a running daemon, which this job does not provide. Its
        # backpressure logic is covered without one, so that check runs here.
        pytest projects/gnrcore/packages/test/tests/test_pages_documented.py \
               projects/gnrcore/packages/test/tests/test_pages_framecodes.py \
               projects/gnrcore/packages/test/tests/test_pages_ratchet.py \
               projects/gnrcore/packages/test/tests/test_smoke_backpressure.py -q
