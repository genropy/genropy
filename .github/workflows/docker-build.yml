name: Build docker image

# Reusable build of the genropy image, called by docker.yml (nightly develop)
# and release-publish.yml (release tags). It builds the commit of the caller's
# run and pushes it under a single tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to push (e.g. "develop" or "26.11.15")
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main Docker image
        uses: docker/build-push-action@v5
        with:
          file: ./dockerfiles/genropy/Dockerfile
          context: ./
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          platforms: linux/amd64,linux/arm64
          provenance: false
