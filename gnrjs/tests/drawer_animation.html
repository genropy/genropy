<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawer animation regression checks</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../dojo_libs/dojo_11/dojo/dijit/themes/tundra/tundra.css">
<link rel="stylesheet" href="../gnr_d11/css/gnrbase_css/04_gnr_layout.css">
<style>
body {font: 14px sans-serif; padding: 20px;}
.fixture {position: relative; width: min(900px, 100%); height: 220px; margin: 20px 0;}
pre {white-space: pre-wrap;}
.hiddenSplitter {display: none;}
.slotbarOpener {background: #345; opacity: 1; color: white;}
.closedSide > .dijitContentPane {overflow: hidden;}
</style>
<script src="../../dojo_libs/dojo_11/dojo/dojo/dojo.js"></script>
<script>dojo.require('dijit.layout.BorderContainer'); dojo.require('dijit.layout.ContentPane');
window.gnr = {}; window.genro = {fakeResize() {}, dom: {
    setClass(node, name, enabled) {
        node = node.widget ? node.widget.domNode : node;
        (enabled ? dojo.addClass : dojo.removeClass)(node, name);
    }
}};
</script>
<script src="../gnr_d11/js/gnrlang.js"></script>
<script src="../gnr_d11/js/gnrbag.js"></script>
<script src="../gnr_d11/js/gnrdomsource.js"></script>
<script src="../gnr_d11/js/genro_frm.js"></script>
<script src="../gnr_d11/js/genro_widgets.js"></script>
</head>
<body class="tundra">
<h1>Drawer animation regression checks</h1>
<button id="run">Run checks</button>
<button id="regular">Toggle left panel</button>
<button id="closable">Toggle grouper</button>
<pre id="result">Ready</pre>
<div id="regularFixture" class="fixture"></div>
<div id="closableFixture" class="fixture"></div>
<script>
const prototype = gnr.widgets.BorderContainer.prototype;
function fixture(id, attributes) {
    const bc = new dijit.layout.BorderContainer({}, document.getElementById(id));
    for (const key in prototype) {
        if (key.startsWith('mixin_')) bc[key.slice(6)] = prototype[key];
    }
    bc._saved_size = {}; bc._drawerAnimations = {}; bc._closableRegions = {};
    const Pane = attributes.closable ? dijit.layout.BorderContainer : dijit.layout.ContentPane;
    const left = new Pane({region: 'left', splitter: true,
        style: 'width: 320px; border: 2px solid #345; padding: 8px; background: #e4eef4;'});
    const source = {attr: {region: 'left', ...attributes}, widget: left,
        getAttributeFromDatasource(name) {return this.attr[name];}, publish() {},
        _(tag, attrs) {
            const node = document.createElement(tag);
            node.className = attrs._class || '';
            if (attrs.connect_onclick) node.addEventListener('click', attrs.connect_onclick);
            left.domNode.appendChild(node);
            return {_(childTag, childAttrs) {
                const child = document.createElement(childTag);
                child.textContent = childAttrs.innerHTML || 'Σ'; node.appendChild(child);
            }};
        }
    };
    left.sourceNode = source;
    left.parentBorderContainer = bc;
    source.getLabelWrapper = () => null;
    if (attributes.closable) {
        left.startup();
        const content = new dijit.layout.ContentPane({region: 'center'});
        content.setContent('Grouper content');
        left.addChild(content);
    } else {
        left.setContent('Side panel');
    }
    const center = new dijit.layout.ContentPane({region: 'center', content: 'Center content'});
    center.setContent('<div style="width: 1400px; height: 400px">Scrollable center content</div>');
    bc.startup(); bc.addChild(left); bc.addChild(center);
    bc.sourceNode = {attr: {}};
    prototype.afterStartup(bc);
    if (attributes.closable) prototype.addClosableHandle(bc, source, attributes);
    return {bc, left, center};
}
const regular = fixture('regularFixture', {drawer_animate: true});
const closable = fixture('closableFixture', {closable: 'close', closable_animate: true, closable_label: 'Σ'});
document.getElementById('regular').onclick = () => regular.bc.setRegionVisible('left', 'toggle');
document.getElementById('closable').onclick = () => closable.left.domNode.querySelector('.slotbarOpener').click();
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
function check(value, message) {if (!value) throw new Error(message);}
document.getElementById('run').onclick = async function() {
    this.disabled = true;
    const result = document.getElementById('result');
    result.textContent = 'Running';
    try {
        regular.bc.showHideRegion('left', true, false);
        const initialWidth = regular.left.domNode.getBoundingClientRect().width;
        regular.bc.setRegionVisible('left', false);
        await new Promise(resolve => requestAnimationFrame(resolve));
        check(regular.left.domNode.getBoundingClientRect().width <= initialWidth + 1, 'Border/padding caused a jump at animation start');
        await wait(110);
        const partialWidth = regular.left.domNode.getBoundingClientRect().width;
        check(partialWidth > 0 && partialWidth < initialWidth, 'No intermediate width');
        regular.bc.setRegionVisible('left', 'toggle');
        await wait(360);
        check(Math.abs(regular.left.domNode.getBoundingClientRect().width - initialWidth) < 1, 'Border/padding changed the restored width');
        regular.left.domNode.style.width = '410px';
        regular.bc.setRegionVisible('left', false); await wait(360);
        check(getComputedStyle(regular.bc._splitters.left).display === 'none', 'Regular splitter remained visible');
        regular.bc.setRegionVisible('left', true); await wait(360);
        check(regular.left.domNode.style.width === '410px', 'Manual resize was lost');
        check(regular.bc._splitters.left.getBoundingClientRect().width > 0, 'Reopened splitter lost its thickness');
        regular.bc.setRegions({region: 'left', size: '55%', show: true}); await wait(360);
        check(regular.left.domNode.style.width === '55%', 'Relative width was lost');
        regular.bc.setRegionVisible('left', false); await wait(80);
        regular.bc.showHideRegion('left', true, false); await wait(360);
        check(regular.bc.isRegionVisible('left') && !regular.bc._drawerAnimations.left, 'Immediate command was overwritten');
        // The legacy, non-animated closable path must retain its handle and width.
        closable.left.sourceNode.attr.closable_animate = false;
        closable.bc.showHideRegion('left', true);
        check(!closable.bc._drawerAnimations.left, 'Opt-out still animated');
        closable.bc.showHideRegion('left', false);
        check(closable.left.domNode.style.display !== 'none', 'Closable handle was hidden');
        closable.left.sourceNode.attr.closable_animate = true;
        const closedWidth = closable.left.domNode.getBoundingClientRect().width;
        closable.bc.setRegions({region: 'left', size: '340px', show: false});
        check(closable.left.domNode.getBoundingClientRect().width === closedWidth, 'Resizing a closed closable expanded it');
        const opener = closable.left.domNode.querySelector('.slotbarOpener');
        opener.click(); await wait(100);
        const rect = opener.getBoundingClientRect();
        check(opener.contains(document.elementFromPoint(rect.x + rect.width/2, rect.y + rect.height/2)), 'Opener is clipped during animation');
        opener.click(); await wait(360);
        check(!closable.bc.isRegionVisible('left'), 'Rapid closable toggle did not close');
        opener.click(); await wait(360);
        check(closable.bc.isRegionVisible('left'), 'Closable did not reopen');
        check(closable.left.domNode.style.width === '340px', 'Closable lost its width');
        regular.bc.showHideRegion('left', true, false);
        regular.bc.showHideRegion('left', false);
        await wait(100);
        check(getComputedStyle(regular.center.domNode).scrollbarColor === 'rgba(0, 0, 0, 0) rgba(0, 0, 0, 0)', 'Animated center scrollbar is visible');
        const gutter = regular.center.domNode.offsetWidth - regular.center.domNode.clientWidth;
        regular.bc.showHideRegion('left', true, false);
        check(!regular.bc.domNode.classList.contains('gnrDrawerAnimating'), 'Scrollbar suppression leaked after cancellation');
        check(getComputedStyle(regular.center.domNode).scrollbarColor === 'auto', 'Scrollbar appearance was not restored');
        check(regular.center.domNode.offsetWidth - regular.center.domNode.clientWidth === gutter, 'Scrollbar gutter changed');
        regular.center.domNode.scrollTop = 80;
        check(regular.center.domNode.scrollTop === 80, 'Center no longer scrolls');
        regular.bc.showHideRegion('left', false, false);
        regular.bc.showHideRegion('left', true);
        await wait(100);
        gnr.GnrDomSourceNode.prototype.setHidden.call(regular.left.sourceNode, true);
        await wait(360);
        check(regular.left.domNode.style.display === 'none', 'Opening animation overrode setHidden(true)');
        check(!regular.bc._drawerAnimations.left, 'setHidden left an animation running');
        regular.bc.showHideRegion('left', true, false);
        closable.bc.showHideRegion('left', true, false);
        const centerLeft = closable.center.domNode.getBoundingClientRect().left;
        closable.bc.showHideRegion('left', false);
        await wait(100);
        closable.bc.showHideRegion('left', true, false);
        check(Math.abs(closable.center.domNode.getBoundingClientRect().left - centerLeft) < 1, 'Immediate open left the closable center at the intermediate position');
        result.textContent = 'PASS: scrollbar suppression/restoration, stable gutters, scrolling, hidden precedence, closable cancellation; intermediate layout, borders/padding, rapid reversal, manual resize, splitter visibility, relative sizes, cancellation, clickable closable handle.';
    } catch (error) {
        result.textContent = 'FAIL: ' + error.message;
        console.error(error);
    } finally {this.disabled = false;}
};
</script>
</body>
</html>
